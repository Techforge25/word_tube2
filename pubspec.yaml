  change_app_package_name: ^1.4.0
  rename_app: ^1.6.1
  flutter_launcher_icons: ^0.14.1
  flutter_slidable: ^3.1.2
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11

